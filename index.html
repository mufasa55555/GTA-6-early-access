<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA 6 early access</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Helvetica Bold', Helvetica, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .panel {
            border: 2px dashed #000000;
            padding: 40px;
            background-color: #000;
            text-align: center;
        }
        input {
            background-color: #111;
            border: 1px solid #ffffff;
            color: #ffffff;
            padding: 10px;
            text-align: center;
            font-size: 18px;
            margin-top: 20px;
        }
        button {
            background-color: #ffffff;
            color: black;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="panel">
    <h2>data encrypted bih</h2>
    <p>basically its all gone</p>
    <p>get the password from to get it back</p>
    <input type="text" id="riddleInput" placeholder="enter password">
    <br>
    <button onclick="trySolve()">enter</button>
    <div id="feedback" style="margin-top: 20px;"></div>
</div>

<script>
    let audioCtx = null;

    function playSpookySound() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(100, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(40, audioCtx.currentTime + 1);
        
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 1);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.start();
        osc.stop(audioCtx.currentTime + 1);
    }

    function trySolve() {
        playSpookySound();
        document.getElementById('feedback').textContent = "why was that lowkey the wrong password tho 👀";
    }
</script>

</body>
</html>
